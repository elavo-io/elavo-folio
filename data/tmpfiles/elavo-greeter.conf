# The greeter runs as greetd and cannot read home directories. Sessions
# publish their wallpaper here, and the greeter remembers who signed in last.
d /var/lib/elavo 0755 root root -
d /var/lib/elavo/greeter 0755 root root -
d /var/lib/elavo/greeter/wallpapers 0755 root root -
f /var/lib/elavo/greeter/last-user 0644 greetd greetd -
