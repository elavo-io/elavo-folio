[workspace]
resolver = "2"
members = [
    "crates/elavo-common",
    "crates/elavo-panel",
    "crates/elavo-dock",
    "crates/elavo-dock-settings",
    "crates/elavo-lens",
    "crates/elavo-switcher",
    "crates/elavo-switcher-settings",
    "crates/elavo-greeter",
    "crates/elavo-input",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/elavo-io/elavo-folio"

[workspace.dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
gdk4-wayland = "0.11"
gtk4-layer-shell = "0.8"
gtk4-session-lock = { version = "0.4", features = ["v1_2"] }
serde_json = "1"
gio-unix = "0.22"
glib-build-tools = "0.22"
wayland-client = { version = "0.31", features = ["system"] }
# dlopen keeps libwayland-client out of the binaries' link list. When it
# is linked ahead of libgtk4-layer-shell, layer surfaces silently fail.
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
async-channel = "2"
libc = "0.2"
elavo-common = { path = "crates/elavo-common" }
elavo-dock-settings = { path = "crates/elavo-dock-settings" }
elavo-switcher-settings = { path = "crates/elavo-switcher-settings" }

[profile.release]
lto = "thin"
strip = true
